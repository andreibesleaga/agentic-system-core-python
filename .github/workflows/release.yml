# Publish to PyPI when a version tag is pushed.
#
# There is no token anywhere in this repository. PyPI's trusted publishing lets
# this one workflow, in this one repository, exchange a short-lived GitHub OIDC
# token for an upload token, which is why the publish job asks for
# `id-token: write` and nothing else. The action's own README says: "To enter
# the trusted publishing flow, configure this action's job with the
# `id-token: write` permission and **without** an explicit username or password"
# (https://github.com/pypa/gh-action-pypi-publish, read 2026-09-22).
#
# Every action is pinned to a commit, not a tag, so that a moved tag cannot
# change what runs here, and every tool is installed at an exact version.
#
# Order: (1) the tag must be the version in pyproject.toml, the engine's
# specification tag follows from that version, and the tagged commit must be on
# `main`; (2) the whole test lane, test.yml, called with that engine tag — the same
# legs, the same equivalence tests, the same port-implementer scenarios, ruff and mypy
# as every pull request, so a release is never tested less than a pull request;
# (3) the build, once, on 3.12; (4) the upload. The engine tag is the package version
# in the engine's spelling: 1.0.0rc7 -> 1.0.0-rc.7, 1.0.0 -> 1.0.0, a post release
# 1.0.0.post1 -> 1.0.0 (it tests against the release it follows); a version with no
# such tag (an alpha, a beta, a development release) is refused, never guessed.
#
# The one-time PyPI setup and the tag (v<version>, e.g. v1.0.0rc7) are the
# maintainer's.

name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  version:
    name: version, engine tag and main
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.derive.outputs.version }}
      engine_ref: ${{ steps.derive.outputs.engine_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history and every branch, so that the ancestor check can see main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: the tag must be the version; the engine tag follows from it
        id: derive
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          with open('pyproject.toml', 'rb') as handle:
              version = tomllib.load(handle)['project']['version']
          if tag != 'v' + version:
              sys.exit('tag %s does not match version %s in pyproject.toml' % (tag, version))
          match = re.fullmatch(r'([0-9]+[.][0-9]+[.][0-9]+)(?:rc([0-9]+))?(?:[.]post[0-9]+)?', version)
          if match is None:
              sys.exit('version %s has no engine tag: a release is X.Y.Z or X.Y.ZrcN, '
                       'with or without .postN' % version)
          release, candidate = match.groups()
          engine = release if candidate is None else '%s-rc.%s' % (release, candidate)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=%s\nengine_ref=%s\n' % (version, engine))
          print('tag %s matches version %s; the engine is tested at its tag %s' % (tag, version, engine))
          PY
      - name: the tagged commit must be on main
        env:
          VERSION: ${{ steps.derive.outputs.version }}
        run: |
          commit="$(git rev-parse "v${VERSION}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::the commit of tag v${VERSION} (${commit}) is not on main"
            exit 1
          fi
          echo "the commit of tag v${VERSION} (${commit}) is on main"

  test:
    name: test
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      engine_ref: ${{ needs.version.outputs.engine_ref }}

  build:
    name: build
    needs: [version, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install the build tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: build the sdist and the wheel
        run: python -m build
      - name: check the distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-system-core
    permissions:
      id-token: write   # IMPORTANT: this permission is what trusted publishing needs
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

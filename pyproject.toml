[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-system-core"
version = "1.0.0rc6"
description = "Two standalone checkers and a reading API for AgenticSystemCore knowledge nodes, in pure Python, with one agsc command that hands every other verb to the Node engine."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Nicolae Besleaga" }]
keywords = ["agentic", "knowledge", "linkset", "discovery", "conformance", "rfc9264", "rfc8785"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Homepage = "https://agenticsystemcore.com"
Source = "https://github.com/andreibesleaga/agentic-system-core-python"
Specification = "https://agenticsystemcore.com/specs/agentic-knowledge/"
"Bug Tracker" = "https://github.com/andreibesleaga/agentic-system-core/issues"

[project.scripts]
agsc = "agentic_system_core.cli:console_main"

[project.optional-dependencies]
test = ["pytest>=7", "coverage>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_system_core = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/agentic_system_core"]

[tool.coverage.report]
fail_under = 95
show_missing = true
